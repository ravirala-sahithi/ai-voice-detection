# Test Environment Configuration
server.port=8081
spring.application.name=voice-clone-backend-test

# Use In-Memory H2 for local unit/integration tests
spring.datasource.url=jdbc:h2:mem:voice_clone_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# AI Service Mock URL for Tests
ai.service.url=http://127.0.0.1:8000
ai.service.connect-timeout-ms=2000
ai.service.read-timeout-ms=5000

# Test JWT Secret
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:5173
